<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white">
        <div class="container mx-auto px-4 py-6">
            <div class="flex flex-col md:flex-row items-center justify-between">
                <div class="flex items-center">
                    <i class="fas fa-newspaper text-3xl mr-3"></i>
                    <h1 class="text-3xl font-bold">Fake News Detector</h1>
                </div>
                <p class="mt-2 md:mt-0 text-blue-100">Verify the authenticity of news with ML</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6">
        <!-- Input Section -->
        <section class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Verify News</h2>

            <!-- Input Type Tabs -->
            <div class="mb-6 border-b border-gray-200">
                <ul class="flex flex-wrap -mb-px" id="input-tabs" role="tablist">
                    <li class="mr-2" role="presentation">
                        <button class="inline-block py-2 px-4 text-blue-600 border-b-2 border-blue-600 rounded-t-lg active"
                                id="text-tab"
                                data-tab="text-input"
                                type="button"
                                role="tab">
                            <i class="fas fa-align-left mr-2"></i>Text
                        </button>
                    </li>
                    <li class="mr-2" role="presentation">
                        <button class="inline-block py-2 px-4 text-gray-500 hover:text-gray-600 hover:border-gray-300 rounded-t-lg"
                                id="url-tab"
                                data-tab="url-input"
                                type="button"
                                role="tab">
                            <i class="fas fa-link mr-2"></i>URL
                        </button>
                    </li>
                    <li role="presentation">
                        <button class="inline-block py-2 px-4 text-gray-500 hover:text-gray-600 hover:border-gray-300 rounded-t-lg"
                                id="image-tab"
                                data-tab="image-input"
                                type="button"
                                role="tab">
                            <i class="fas fa-image mr-2"></i>Image
                        </button>
                    </li>
                </ul>
            </div>

            <!-- Text Input Panel -->
            <div class="tab-panel active" id="text-input">
                <div class="mb-4">
                    <label for="news-text" class="block text-gray-700 text-sm font-bold mb-2">Paste news article text:</label>
                    <textarea id="news-text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" rows="6" placeholder="Paste the full text of the news article here..."></textarea>
                </div>
                <button id="analyze-text-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline flex items-center">
                    <i class="fas fa-search mr-2"></i>Analyze Text
                </button>
            </div>

            <!-- URL Input Panel -->
            <div class="tab-panel hidden" id="url-input">
                <div class="mb-4">
                    <label for="news-url" class="block text-gray-700 text-sm font-bold mb-2">Enter news article URL:</label>
                    <input type="url" id="news-url" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="https://example.com/news-article">
                </div>
                <button id="analyze-url-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline flex items-center">
                    <i class="fas fa-globe mr-2"></i>Analyze URL
                </button>
            </div>

            <!-- Image Input Panel -->
            <div class="tab-panel hidden" id="image-input">
                <div class="mb-4">
                    <label for="news-image" class="block text-gray-700 text-sm font-bold mb-2">Upload screenshot of news:</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="news-image" class="flex flex-col w-full h-32 border-4 border-dashed hover:bg-gray-100 hover:border-blue-300 rounded-lg">
                            <div class="flex flex-col items-center justify-center pt-7">
                                <i class="fas fa-cloud-upload-alt text-3xl text-gray-400 group-hover:text-gray-600"></i>
                                <p class="pt-1 text-sm text-gray-400 group-hover:text-gray-600">
                                    Drag & drop an image or click to select
                                </p>
                            </div>
                            <input type="file" id="news-image" class="hidden" accept="image/*">
                        </label>
                    </div>
                    <div id="image-preview" class="mt-4 hidden">
                        <p class="text-sm text-gray-600 mb-2">Selected image:</p>
                        <img id="preview-img" class="max-h-48 rounded border border-gray-300" src="" alt="Preview">
                    </div>
                </div>
                <button id="analyze-image-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline flex items-center">
                    <i class="fas fa-camera mr-2"></i>Analyze Image
                </button>
            </div>
        </section>

        <!-- Results Section -->
        <section id="results-section" class="bg-white rounded-lg shadow-md p-6 mb-8 hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Analysis Results</h2>

            <div class="flex flex-col md:flex-row md:space-x-4">
                <!-- Prediction Result -->
                <div class="w-full md:w-1/3 mb-4 md:mb-0">
                    <div class="border rounded-lg p-4 h-full">
                        <h3 class="text-xl font-semibold mb-2">Prediction</h3>
                        <div id="prediction-result" class="flex items-center justify-center p-4 rounded-lg">
                            <div class="text-center">
                                <div id="prediction-icon" class="mx-auto text-4xl mb-2"></div>
                                <div id="prediction-label" class="text-2xl font-bold mb-1"></div>
                                <div id="confidence-score" class="text-gray-600"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Content Preview -->
                <div class="w-full md:w-2/3">
                    <div class="border rounded-lg p-4 h-full">
                        <h3 class="text-xl font-semibold mb-2">Analyzed Content</h3>
                        <div id="content-preview" class="text-gray-700 max-h-64 overflow-y-auto"></div>
                        <div id="source-url" class="mt-4 text-blue-600 hidden">
                            <a href="#" target="_blank" class="flex items-center">
                                <i class="fas fa-external-link-alt mr-1"></i>
                                <span>View Original Source</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Trending News Section -->
        <section class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-gray-800">Trending News</h2>
                <button id="refresh-news-btn" class="text-blue-600 hover:text-blue-800">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>

            <div id="trending-news" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- News items will be populated here -->
                <div class="trending-news-loader flex justify-center items-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white">
        <div class="container mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row items-center justify-between">
                <div class="mb-2 md:mb-0">
                    <p>© 2025 Fake News Detector | <span class="text-gray-400">Powered by AI</span></p>
                </div>
                <div class="flex space-x-4">
                    <button class="hover:text-blue-400" id="about-btn">
                        <i class="fas fa-info-circle mr-1"></i>About
                    </button>
                    <button class="hover:text-blue-400" id="disclaimer-btn">
                        <i class="fas fa-exclamation-triangle mr-1"></i>Disclaimer
                    </button>
                </div>
            </div>
        </div>
    </footer>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center hidden">
        <div class="bg-white rounded-lg max-w-lg w-full mx-4">
            <div class="flex justify-between items-center border-b px-4 py-3">
                <h3 id="modal-title" class="text-lg font-semibold text-gray-800"></h3>
                <button id="close-modal" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modal-content" class="p-4"></div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 flex justify-center items-center hidden">
        <div class="bg-white p-5 rounded-lg flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mb-4"></div>
            <p id="loading-message" class="text-gray-700">Analyzing... Please wait</p>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
